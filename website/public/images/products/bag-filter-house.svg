<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f7f2ea"/>
  <!-- Main housing -->
  <rect x="200" y="100" width="400" height="280" stroke="#1a3325" stroke-width="3" fill="none" rx="4"/>
  <!-- Clean air plenum (top) -->
  <rect x="200" y="100" width="400" height="60" stroke="#1a3325" stroke-width="3" fill="#eee8d8" rx="4"/>
  <text x="400" y="136" font-family="monospace" font-size="10" fill="#5a6e58" text-anchor="middle">CLEAN AIR PLENUM</text>
  <!-- Pulse tubes -->
  <line x1="260" y1="160" x2="260" y2="175" stroke="#c4a96b" stroke-width="2"/>
  <line x1="330" y1="160" x2="330" y2="175" stroke="#c4a96b" stroke-width="2"/>
  <line x1="400" y1="160" x2="400" y2="175" stroke="#c4a96b" stroke-width="2"/>
  <line x1="470" y1="160" x2="470" y2="175" stroke="#c4a96b" stroke-width="2"/>
  <line x1="540" y1="160" x2="540" y2="175" stroke="#c4a96b" stroke-width="2"/>
  <!-- Filter bags -->
  <rect x="250" y="175" width="20" height="120" rx="3" stroke="#1a3325" stroke-width="1.5" fill="none"/>
  <rect x="320" y="175" width="20" height="120" rx="3" stroke="#1a3325" stroke-width="1.5" fill="none"/>
  <rect x="390" y="175" width="20" height="120" rx="3" stroke="#1a3325" stroke-width="1.5" fill="none"/>
  <rect x="460" y="175" width="20" height="120" rx="3" stroke="#1a3325" stroke-width="1.5" fill="none"/>
  <rect x="530" y="175" width="20" height="120" rx="3" stroke="#1a3325" stroke-width="1.5" fill="none"/>
  <!-- Dust dots on bags -->
  <circle cx="260" cy="220" r="2" fill="#5a6e58" opacity="0.4"/>
  <circle cx="260" cy="250" r="1.5" fill="#5a6e58" opacity="0.3"/>
  <circle cx="330" cy="235" r="2" fill="#5a6e58" opacity="0.4"/>
  <circle cx="400" cy="210" r="1.5" fill="#5a6e58" opacity="0.3"/>
  <circle cx="470" cy="260" r="2" fill="#5a6e58" opacity="0.4"/>
  <circle cx="540" cy="225" r="2" fill="#5a6e58" opacity="0.3"/>
  <!-- Hopper -->
  <polygon points="200,380 300,440 500,440 600,380" stroke="#1a3325" stroke-width="3" fill="none"/>
  <!-- Dust discharge -->
  <rect x="370" y="440" width="60" height="25" stroke="#1a3325" stroke-width="2" fill="#eee8d8" rx="2"/>
  <text x="400" y="457" font-family="monospace" font-size="7" fill="#5a6e58" text-anchor="middle">ROTARY VALVE</text>
  <!-- Dirty air inlet -->
  <rect x="130" y="300" width="70" height="40" stroke="#5a6e58" stroke-width="2" fill="none" rx="2"/>
  <text x="165" y="318" font-family="monospace" font-size="7" fill="#5a6e58" text-anchor="middle">DIRTY</text>
  <text x="165" y="330" font-family="monospace" font-size="7" fill="#5a6e58" text-anchor="middle">GAS IN</text>
  <path d="M200,320 L215,320" stroke="#5a6e58" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <!-- Clean air outlet -->
  <rect x="600" y="110" width="70" height="35" stroke="#c4a96b" stroke-width="2" fill="none" rx="2"/>
  <text x="635" y="132" font-family="monospace" font-size="7" fill="#c4a96b" text-anchor="middle">CLEAN OUT</text>
  <path d="M600,127 L585,127" stroke="#c4a96b" stroke-width="1.5"/>
  <!-- Compressed air header -->
  <line x1="240" y1="90" x2="560" y2="90" stroke="#c4a96b" stroke-width="2"/>
  <text x="400" y="85" font-family="monospace" font-size="8" fill="#c4a96b" text-anchor="middle">PULSE AIR HEADER</text>
  <!-- Labels -->
  <text x="400" y="35" font-family="Georgia, serif" font-size="22" fill="#1a3325" text-anchor="middle" font-weight="bold">Bag Filter House</text>
  <text x="400" y="58" font-family="monospace" font-size="11" fill="#5a6e58" text-anchor="middle" letter-spacing="2">DUST COLLECTION</text>
  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5a6e58"/>
    </marker>
  </defs>
</svg>