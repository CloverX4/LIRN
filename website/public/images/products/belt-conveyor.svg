<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f7f2ea"/>
  <!-- Frame / structure -->
  <line x1="100" y1="380" x2="700" y2="380" stroke="#1a3325" stroke-width="2"/>
  <!-- Support legs -->
  <line x1="150" y1="380" x2="150" y2="290" stroke="#1a3325" stroke-width="2.5"/>
  <line x1="350" y1="380" x2="350" y2="240" stroke="#1a3325" stroke-width="2.5"/>
  <line x1="550" y1="380" x2="550" y2="190" stroke="#1a3325" stroke-width="2.5"/>
  <!-- Stringers (frame rails) -->
  <line x1="120" y1="280" x2="680" y2="160" stroke="#1a3325" stroke-width="2"/>
  <line x1="120" y1="310" x2="680" y2="190" stroke="#1a3325" stroke-width="2"/>
  <!-- Belt - top (carry side) -->
  <line x1="120" y1="270" x2="680" y2="150" stroke="#1a3325" stroke-width="3"/>
  <!-- Belt - bottom (return) -->
  <line x1="120" y1="320" x2="680" y2="200" stroke="#5a6e58" stroke-width="1.5" stroke-dasharray="8,4"/>
  <!-- Head pulley -->
  <circle cx="685" cy="175" r="22" stroke="#1a3325" stroke-width="2.5" fill="#eee8d8"/>
  <circle cx="685" cy="175" r="5" fill="#1a3325"/>
  <!-- Tail pulley -->
  <circle cx="115" cy="295" r="18" stroke="#1a3325" stroke-width="2.5" fill="#eee8d8"/>
  <circle cx="115" cy="295" r="4" fill="#1a3325"/>
  <!-- Idlers (carry side) -->
  <g stroke="#5a6e58" stroke-width="1.5">
    <line x1="200" y1="258" x2="220" y2="268" />
    <line x1="300" y1="238" x2="320" y2="248" />
    <line x1="400" y1="218" x2="420" y2="228" />
    <line x1="500" y1="198" x2="520" y2="208" />
    <line x1="600" y1="178" x2="620" y2="188" />
  </g>
  <!-- Troughed profile indicator -->
  <path d="M380,200 L395,210 L410,200" stroke="#c4a96b" stroke-width="2" fill="none"/>
  <text x="395" y="195" font-family="monospace" font-size="8" fill="#c4a96b" text-anchor="middle">TROUGHED</text>
  <!-- Material on belt -->
  <path d="M180,253 Q250,235 320,233 Q400,228 480,200 Q550,183 630,163" stroke="#c4a96b" stroke-width="2" fill="none"/>
  <path d="M180,260 Q250,242 320,240 Q400,235 480,207 Q550,190 630,170" stroke="#1a3325" stroke-width="1"/>
  <!-- Material dots -->
  <circle cx="250" cy="245" r="3" fill="#c4a96b" opacity="0.4"/>
  <circle cx="350" cy="228" r="2.5" fill="#c4a96b" opacity="0.3"/>
  <circle cx="450" cy="210" r="3" fill="#c4a96b" opacity="0.4"/>
  <circle cx="550" cy="190" r="2" fill="#c4a96b" opacity="0.3"/>
  <!-- Drive motor -->
  <rect x="700" y="155" width="50" height="40" rx="3" stroke="#1a3325" stroke-width="2" fill="#eee8d8"/>
  <text x="725" y="178" font-family="monospace" font-size="7" fill="#5a6e58" text-anchor="middle">DRIVE</text>
  <!-- Feed chute -->
  <polygon points="140,220 180,250 200,250 160,220" stroke="#5a6e58" stroke-width="1.5" fill="none"/>
  <!-- Discharge -->
  <path d="M690,185 Q710,200 720,230" stroke="#c4a96b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Labels -->
  <text x="400" y="45" font-family="Georgia, serif" font-size="22" fill="#1a3325" text-anchor="middle" font-weight="bold">Belt Conveyor</text>
  <text x="400" y="70" font-family="monospace" font-size="11" fill="#5a6e58" text-anchor="middle" letter-spacing="2">MATERIAL HANDLING</text>
  <!-- Dimension -->
  <line x1="115" y1="410" x2="685" y2="410" stroke="#5a6e58" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="115" y1="405" x2="115" y2="415" stroke="#5a6e58" stroke-width="1"/>
  <line x1="685" y1="405" x2="685" y2="415" stroke="#5a6e58" stroke-width="1"/>
  <text x="400" y="428" font-family="monospace" font-size="10" fill="#5a6e58" text-anchor="middle">Up to 200m</text>
</svg>