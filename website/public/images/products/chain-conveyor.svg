<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f7f2ea"/>
  <!-- Trough / casing -->
  <rect x="120" y="200" width="560" height="100" stroke="#1a3325" stroke-width="3" fill="none" rx="4"/>
  <!-- Trough bottom plate -->
  <line x1="120" y1="260" x2="680" y2="260" stroke="#5a6e58" stroke-width="1.5" stroke-dasharray="6,3"/>
  <!-- Chain (top strand) -->
  <line x1="100" y1="230" x2="700" y2="230" stroke="#1a3325" stroke-width="2.5"/>
  <!-- Chain links -->
  <g stroke="#c4a96b" stroke-width="1.5" fill="none">
    <rect x="165" y="225" width="15" height="10" rx="2"/>
    <rect x="225" y="225" width="15" height="10" rx="2"/>
    <rect x="285" y="225" width="15" height="10" rx="2"/>
    <rect x="345" y="225" width="15" height="10" rx="2"/>
    <rect x="405" y="225" width="15" height="10" rx="2"/>
    <rect x="465" y="225" width="15" height="10" rx="2"/>
    <rect x="525" y="225" width="15" height="10" rx="2"/>
    <rect x="585" y="225" width="15" height="10" rx="2"/>
  </g>
  <!-- Flights -->
  <g stroke="#1a3325" stroke-width="2">
    <line x1="190" y1="230" x2="190" y2="260"/>
    <line x1="250" y1="230" x2="250" y2="260"/>
    <line x1="310" y1="230" x2="310" y2="260"/>
    <line x1="370" y1="230" x2="370" y2="260"/>
    <line x1="430" y1="230" x2="430" y2="260"/>
    <line x1="490" y1="230" x2="490" y2="260"/>
    <line x1="550" y1="230" x2="550" y2="260"/>
    <line x1="610" y1="230" x2="610" y2="260"/>
  </g>
  <!-- Material between flights -->
  <g fill="#c4a96b" opacity="0.2">
    <rect x="195" y="240" width="50" height="20" rx="2"/>
    <rect x="255" y="240" width="50" height="20" rx="2"/>
    <rect x="315" y="240" width="50" height="20" rx="2"/>
    <rect x="375" y="240" width="50" height="20" rx="2"/>
    <rect x="435" y="240" width="50" height="20" rx="2"/>
    <rect x="495" y="240" width="50" height="20" rx="2"/>
  </g>
  <!-- Return chain (bottom) -->
  <line x1="100" y1="280" x2="700" y2="280" stroke="#5a6e58" stroke-width="1.5" stroke-dasharray="8,4"/>
  <!-- Head sprocket -->
  <circle cx="695" cy="255" r="25" stroke="#1a3325" stroke-width="2.5" fill="#eee8d8"/>
  <circle cx="695" cy="255" r="5" fill="#1a3325"/>
  <!-- Tail sprocket -->
  <circle cx="105" cy="255" r="20" stroke="#1a3325" stroke-width="2.5" fill="#eee8d8"/>
  <circle cx="105" cy="255" r="4" fill="#1a3325"/>
  <!-- Drive -->
  <rect x="710" y="230" width="55" height="50" rx="4" stroke="#1a3325" stroke-width="2" fill="#eee8d8"/>
  <text x="737" y="259" font-family="monospace" font-size="8" fill="#5a6e58" text-anchor="middle">DRIVE</text>
  <!-- Feed inlet -->
  <polygon points="170,155 220,195 240,195 190,155" stroke="#5a6e58" stroke-width="2" fill="none"/>
  <text x="200" y="148" font-family="monospace" font-size="8" fill="#5a6e58" text-anchor="middle">INLET</text>
  <!-- Discharge -->
  <rect x="620" y="300" width="50" height="35" stroke="#1a3325" stroke-width="2" fill="#eee8d8" rx="3"/>
  <text x="645" y="322" font-family="monospace" font-size="7" fill="#5a6e58" text-anchor="middle">OUTLET</text>
  <!-- Flow arrow -->
  <path d="M180,320 L620,320" stroke="#c4a96b" stroke-width="1.5" marker-end="url(#arrowC)" opacity="0.5"/>
  <!-- Support structure -->
  <line x1="200" y1="300" x2="200" y2="370" stroke="#1a3325" stroke-width="2"/>
  <line x1="400" y1="300" x2="400" y2="370" stroke="#1a3325" stroke-width="2"/>
  <line x1="600" y1="335" x2="600" y2="370" stroke="#1a3325" stroke-width="2"/>
  <line x1="150" y1="370" x2="650" y2="370" stroke="#1a3325" stroke-width="2"/>
  <!-- Labels -->
  <text x="400" y="55" font-family="Georgia, serif" font-size="22" fill="#1a3325" text-anchor="middle" font-weight="bold">Chain Conveyor</text>
  <text x="400" y="80" font-family="monospace" font-size="11" fill="#5a6e58" text-anchor="middle" letter-spacing="2">HEAVY-DUTY TRANSPORT</text>
  <!-- Temp callout -->
  <rect x="520" y="140" width="120" height="40" rx="4" stroke="#c4a96b" stroke-width="1.5" fill="none"/>
  <text x="580" y="157" font-family="monospace" font-size="8" fill="#c4a96b" text-anchor="middle">SERVICE TEMP</text>
  <text x="580" y="172" font-family="Georgia, serif" font-size="14" fill="#1a3325" text-anchor="middle" font-weight="bold">Up to 1000°C</text>
  <defs>
    <marker id="arrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c4a96b"/>
    </marker>
  </defs>
</svg>