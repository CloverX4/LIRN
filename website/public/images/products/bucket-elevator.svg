<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f7f2ea"/>
  <!-- Main casing -->
  <rect x="330" y="60" width="140" height="380" stroke="#1a3325" stroke-width="3" fill="none" rx="4"/>
  <!-- Head section -->
  <rect x="320" y="55" width="160" height="60" stroke="#1a3325" stroke-width="2.5" fill="#eee8d8" rx="6"/>
  <!-- Boot section -->
  <rect x="320" y="380" width="160" height="60" stroke="#1a3325" stroke-width="2.5" fill="#eee8d8" rx="6"/>
  <!-- Head pulley -->
  <circle cx="400" cy="85" r="20" stroke="#1a3325" stroke-width="2" fill="none"/>
  <circle cx="400" cy="85" r="4" fill="#1a3325"/>
  <!-- Boot pulley -->
  <circle cx="400" cy="410" r="16" stroke="#1a3325" stroke-width="2" fill="none"/>
  <circle cx="400" cy="410" r="3" fill="#1a3325"/>
  <!-- Belt/chain (up side) -->
  <line x1="370" y1="105" x2="370" y2="394" stroke="#1a3325" stroke-width="2"/>
  <!-- Belt/chain (down side) -->
  <line x1="430" y1="105" x2="430" y2="394" stroke="#5a6e58" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Buckets (ascending) -->
  <g fill="none" stroke="#c4a96b" stroke-width="2">
    <path d="M355,140 L355,160 Q362,168 370,168 Q378,168 385,160 L385,140"/>
    <path d="M355,190 L355,210 Q362,218 370,218 Q378,218 385,210 L385,190"/>
    <path d="M355,240 L355,260 Q362,268 370,268 Q378,268 385,260 L385,240"/>
    <path d="M355,290 L355,310 Q362,318 370,318 Q378,318 385,310 L385,290"/>
    <path d="M355,340 L355,360 Q362,368 370,368 Q378,368 385,360 L385,340"/>
  </g>
  <!-- Material in buckets -->
  <path d="M358,155 Q370,148 382,155" stroke="#5a6e58" stroke-width="1.5" fill="#5a6e58" fill-opacity="0.2"/>
  <path d="M358,255 Q370,248 382,255" stroke="#5a6e58" stroke-width="1.5" fill="#5a6e58" fill-opacity="0.2"/>
  <path d="M358,355 Q370,348 382,355" stroke="#5a6e58" stroke-width="1.5" fill="#5a6e58" fill-opacity="0.2"/>
  <!-- Feed inlet -->
  <polygon points="260,390 320,410 320,430 260,420" stroke="#5a6e58" stroke-width="2" fill="none"/>
  <text x="270" y="385" font-family="monospace" font-size="8" fill="#5a6e58" text-anchor="middle">FEED</text>
  <!-- Discharge chute -->
  <polygon points="480,65 540,85 540,105 480,95" stroke="#c4a96b" stroke-width="2" fill="none"/>
  <text x="540" y="65" font-family="monospace" font-size="8" fill="#c4a96b" text-anchor="middle">DISCHARGE</text>
  <!-- Discharge trajectory -->
  <path d="M480,80 Q510,75 535,90" stroke="#c4a96b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Drive motor -->
  <rect x="480" y="65" width="45" height="30" rx="3" stroke="#1a3325" stroke-width="2" fill="#eee8d8"/>
  <text x="502" y="84" font-family="monospace" font-size="7" fill="#5a6e58" text-anchor="middle">DRIVE</text>
  <!-- Height dimension -->
  <line x1="240" y1="60" x2="240" y2="440" stroke="#5a6e58" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="235" y1="60" x2="245" y2="60" stroke="#5a6e58" stroke-width="1"/>
  <line x1="235" y1="440" x2="245" y2="440" stroke="#5a6e58" stroke-width="1"/>
  <text x="225" y="255" font-family="monospace" font-size="10" fill="#5a6e58" text-anchor="middle" transform="rotate(-90, 225, 255)">Up to 50m</text>
  <!-- Labels -->
  <text x="400" y="30" font-family="Georgia, serif" font-size="22" fill="#1a3325" text-anchor="middle" font-weight="bold">Bucket Elevator</text>
  <text x="620" y="250" font-family="monospace" font-size="11" fill="#5a6e58" text-anchor="middle" letter-spacing="1" transform="rotate(90, 620, 250)">VERTICAL TRANSPORT</text>
</svg>