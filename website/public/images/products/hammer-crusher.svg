<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f7f2ea"/>
  <!-- Main housing -->
  <rect x="200" y="120" width="400" height="250" stroke="#1a3325" stroke-width="3" fill="none" rx="6"/>
  <!-- Feed opening -->
  <rect x="300" y="90" width="120" height="30" stroke="#5a6e58" stroke-width="2" fill="none" rx="3"/>
  <text x="360" y="80" font-family="monospace" font-size="8" fill="#5a6e58" text-anchor="middle">FEED INLET</text>
  <!-- Rotor shaft -->
  <circle cx="400" cy="240" r="45" stroke="#1a3325" stroke-width="2.5" fill="#eee8d8"/>
  <circle cx="400" cy="240" r="8" fill="#1a3325"/>
  <!-- Hammers (swinging) -->
  <g stroke="#c4a96b" stroke-width="2.5">
    <line x1="400" y1="195" x2="400" y2="165"/>
    <rect x="388" y="155" width="24" height="15" rx="3" fill="#c4a96b" fill-opacity="0.3"/>
  </g>
  <g stroke="#c4a96b" stroke-width="2.5" transform="rotate(60, 400, 240)">
    <line x1="400" y1="195" x2="400" y2="165"/>
    <rect x="388" y="155" width="24" height="15" rx="3" fill="#c4a96b" fill-opacity="0.3"/>
  </g>
  <g stroke="#c4a96b" stroke-width="2.5" transform="rotate(120, 400, 240)">
    <line x1="400" y1="195" x2="400" y2="165"/>
    <rect x="388" y="155" width="24" height="15" rx="3" fill="#c4a96b" fill-opacity="0.3"/>
  </g>
  <g stroke="#c4a96b" stroke-width="2.5" transform="rotate(180, 400, 240)">
    <line x1="400" y1="195" x2="400" y2="165"/>
    <rect x="388" y="155" width="24" height="15" rx="3" fill="#c4a96b" fill-opacity="0.3"/>
  </g>
  <g stroke="#c4a96b" stroke-width="2.5" transform="rotate(240, 400, 240)">
    <line x1="400" y1="195" x2="400" y2="165"/>
    <rect x="388" y="155" width="24" height="15" rx="3" fill="#c4a96b" fill-opacity="0.3"/>
  </g>
  <g stroke="#c4a96b" stroke-width="2.5" transform="rotate(300, 400, 240)">
    <line x1="400" y1="195" x2="400" y2="165"/>
    <rect x="388" y="155" width="24" height="15" rx="3" fill="#c4a96b" fill-opacity="0.3"/>
  </g>
  <!-- Rotation arrow -->
  <path d="M350,180 A60,60 0 0,1 440,195" stroke="#c4a96b" stroke-width="1.5" fill="none" marker-end="url(#arrowH)"/>
  <text x="340" y="175" font-family="monospace" font-size="8" fill="#c4a96b">800–1500 RPM</text>
  <!-- Breaker plate -->
  <path d="M230,140 L230,320" stroke="#1a3325" stroke-width="4" stroke-linecap="round"/>
  <text x="215" y="230" font-family="monospace" font-size="7" fill="#5a6e58" text-anchor="end" transform="rotate(-90, 215, 230)">BREAKER PLATE</text>
  <!-- Screen (bottom) -->
  <line x1="280" y1="340" x2="520" y2="340" stroke="#1a3325" stroke-width="2"/>
  <!-- Screen holes -->
  <g fill="#5a6e58" opacity="0.4">
    <circle cx="300" cy="340" r="3"/><circle cx="320" cy="340" r="3"/><circle cx="340" cy="340" r="3"/>
    <circle cx="360" cy="340" r="3"/><circle cx="380" cy="340" r="3"/><circle cx="400" cy="340" r="3"/>
    <circle cx="420" cy="340" r="3"/><circle cx="440" cy="340" r="3"/><circle cx="460" cy="340" r="3"/>
    <circle cx="480" cy="340" r="3"/><circle cx="500" cy="340" r="3"/>
  </g>
  <text x="400" y="360" font-family="monospace" font-size="8" fill="#5a6e58" text-anchor="middle">SIZING SCREEN</text>
  <!-- Discharge -->
  <polygon points="340,370 460,370 430,420 370,420" stroke="#1a3325" stroke-width="2" fill="none"/>
  <text x="400" y="440" font-family="monospace" font-size="8" fill="#5a6e58" text-anchor="middle">PRODUCT OUT</text>
  <!-- Drive motor -->
  <rect x="610" y="215" width="55" height="50" rx="4" stroke="#1a3325" stroke-width="2" fill="#eee8d8"/>
  <text x="637" y="244" font-family="monospace" font-size="8" fill="#5a6e58" text-anchor="middle">DRIVE</text>
  <line x1="600" y1="240" x2="445" y2="240" stroke="#1a3325" stroke-width="2"/>
  <!-- Labels -->
  <text x="400" y="40" font-family="Georgia, serif" font-size="22" fill="#1a3325" text-anchor="middle" font-weight="bold">Hammer Crusher</text>
  <text x="400" y="63" font-family="monospace" font-size="11" fill="#5a6e58" text-anchor="middle" letter-spacing="2">SIZE REDUCTION</text>
  <defs>
    <marker id="arrowH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c4a96b"/>
    </marker>
  </defs>
</svg>