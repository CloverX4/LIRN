<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f7f2ea"/>
  <!-- Round duct section -->
  <ellipse cx="200" cy="250" rx="60" ry="70" stroke="#1a3325" stroke-width="3" fill="none"/>
  <ellipse cx="200" cy="250" rx="55" ry="65" stroke="#5a6e58" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <!-- Round duct perspective -->
  <line x1="145" y1="185" x2="350" y2="185" stroke="#1a3325" stroke-width="2"/>
  <line x1="145" y1="315" x2="350" y2="315" stroke="#1a3325" stroke-width="2"/>
  <ellipse cx="350" cy="250" rx="60" ry="70" stroke="#1a3325" stroke-width="2" fill="none" stroke-dasharray="8,4"/>
  <!-- Flange -->
  <ellipse cx="200" cy="250" rx="65" ry="75" stroke="#c4a96b" stroke-width="2" fill="none"/>
  <!-- Bolt holes on flange -->
  <circle cx="200" cy="172" r="3" fill="#c4a96b" opacity="0.6"/>
  <circle cx="200" cy="328" r="3" fill="#c4a96b" opacity="0.6"/>
  <circle cx="132" cy="250" r="3" fill="#c4a96b" opacity="0.6"/>
  <circle cx="268" cy="250" r="3" fill="#c4a96b" opacity="0.6"/>
  <!-- Rectangular duct section -->
  <rect x="450" y="180" width="120" height="140" stroke="#1a3325" stroke-width="3" fill="none" rx="3"/>
  <!-- Rectangular perspective -->
  <line x1="570" y1="180" x2="640" y2="155" stroke="#1a3325" stroke-width="2"/>
  <line x1="570" y1="320" x2="640" y2="295" stroke="#1a3325" stroke-width="2"/>
  <line x1="450" y1="180" x2="520" y2="155" stroke="#1a3325" stroke-width="2"/>
  <rect x="520" y="155" width="120" height="140" stroke="#1a3325" stroke-width="2" fill="none" stroke-dasharray="8,4" rx="3"/>
  <!-- Stiffener angles -->
  <line x1="450" y1="220" x2="570" y2="220" stroke="#5a6e58" stroke-width="1.5"/>
  <line x1="450" y1="280" x2="570" y2="280" stroke="#5a6e58" stroke-width="1.5"/>
  <!-- Access door -->
  <rect x="480" y="235" width="40" height="30" stroke="#c4a96b" stroke-width="1.5" fill="none" rx="2"/>
  <circle cx="515" cy="250" r="3" fill="#c4a96b" opacity="0.5"/>
  <text x="500" y="275" font-family="monospace" font-size="7" fill="#c4a96b" text-anchor="middle">ACCESS</text>
  <!-- Transition piece (connecting both) -->
  <path d="M350,200 Q400,200 450,195" stroke="#5a6e58" stroke-width="1.5" stroke-dasharray="6,3"/>
  <path d="M350,300 Q400,310 450,310" stroke="#5a6e58" stroke-width="1.5" stroke-dasharray="6,3"/>
  <!-- Flow arrows -->
  <path d="M100,250 L140,250" stroke="#c4a96b" stroke-width="2" marker-end="url(#arrowDu)"/>
  <path d="M640,240 L700,240" stroke="#c4a96b" stroke-width="2" marker-end="url(#arrowDu)"/>
  <!-- Airflow text -->
  <text x="80" y="245" font-family="monospace" font-size="9" fill="#c4a96b" text-anchor="end">GAS FLOW</text>
  <!-- Labels -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="22" fill="#1a3325" text-anchor="middle" font-weight="bold">Industrial Ducts</text>
  <text x="400" y="73" font-family="monospace" font-size="11" fill="#5a6e58" text-anchor="middle" letter-spacing="2">GAS HANDLING</text>
  <!-- Type labels -->
  <text x="200" y="370" font-family="monospace" font-size="10" fill="#1a3325" text-anchor="middle">ROUND</text>
  <text x="200" y="385" font-family="monospace" font-size="8" fill="#5a6e58" text-anchor="middle">300–2000mm</text>
  <text x="540" y="370" font-family="monospace" font-size="10" fill="#1a3325" text-anchor="middle">RECTANGULAR</text>
  <text x="540" y="385" font-family="monospace" font-size="8" fill="#5a6e58" text-anchor="middle">Custom sizes</text>
  <!-- Temp callout -->
  <rect x="600" y="90" width="130" height="40" rx="4" stroke="#c4a96b" stroke-width="1.5" fill="none"/>
  <text x="665" y="108" font-family="monospace" font-size="8" fill="#c4a96b" text-anchor="middle">SERVICE TEMP</text>
  <text x="665" y="124" font-family="Georgia, serif" font-size="15" fill="#1a3325" text-anchor="middle" font-weight="bold">Up to 600°C</text>
  <!-- Support bracket -->
  <path d="M250,315 L250,350 L290,350" stroke="#5a6e58" stroke-width="2" fill="none"/>
  <text x="275" y="365" font-family="monospace" font-size="7" fill="#5a6e58" text-anchor="middle">SUPPORT</text>
  <defs>
    <marker id="arrowDu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c4a96b"/>
    </marker>
  </defs>
</svg>