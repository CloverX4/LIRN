<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#f7f2ea"/>
  <!-- Labels -->
  <text x="400" y="40" font-family="Georgia, serif" font-size="22" fill="#1a3325" text-anchor="middle" font-weight="bold">Rotary Dryer</text>
  <text x="400" y="63" font-family="monospace" font-size="11" fill="#5a6e58" text-anchor="middle" letter-spacing="2">MOISTURE REMOVAL</text>
  <!-- Ground -->
  <line x1="80" y1="340" x2="720" y2="340" stroke="#1a3325" stroke-width="2"/>
  <!-- Support pier left -->
  <rect x="165" y="285" width="50" height="55" stroke="#1a3325" stroke-width="2" fill="#eee8d8" rx="2"/>
  <!-- Support pier right -->
  <rect x="535" y="260" width="50" height="80" stroke="#1a3325" stroke-width="2" fill="#eee8d8" rx="2"/>
  <!-- Support rollers -->
  <circle cx="178" cy="280" r="7" stroke="#1a3325" stroke-width="2" fill="#eee8d8"/>
  <circle cx="202" cy="280" r="7" stroke="#1a3325" stroke-width="2" fill="#eee8d8"/>
  <circle cx="548" cy="255" r="7" stroke="#1a3325" stroke-width="2" fill="#eee8d8"/>
  <circle cx="572" cy="255" r="7" stroke="#1a3325" stroke-width="2" fill="#eee8d8"/>
  <!-- Dryer drum -->
  <line x1="130" y1="265" x2="630" y2="230" stroke="#1a3325" stroke-width="3"/>
  <line x1="130" y1="290" x2="630" y2="255" stroke="#1a3325" stroke-width="3"/>
  <!-- End caps -->
  <ellipse cx="130" cy="277" rx="7" ry="14" stroke="#1a3325" stroke-width="2.5" fill="#eee8d8"/>
  <ellipse cx="630" cy="242" rx="7" ry="14" stroke="#1a3325" stroke-width="2.5" fill="#eee8d8"/>
  <!-- Internal flights (simple dashes) -->
  <g stroke="#5a6e58" stroke-width="1.5" opacity="0.5">
    <line x1="220" y1="265" x2="225" y2="275"/>
    <line x1="300" y1="258" x2="305" y2="268"/>
    <line x1="380" y1="252" x2="385" y2="262"/>
    <line x1="460" y1="246" x2="465" y2="256"/>
    <line x1="540" y1="238" x2="545" y2="248"/>
  </g>
  <!-- Hot air inlet (left) -->
  <rect x="70" y="260" width="60" height="30" stroke="#c4a96b" stroke-width="2" fill="none" rx="3"/>
  <text x="100" y="278" font-family="monospace" font-size="8" fill="#c4a96b" text-anchor="middle">HOT AIR</text>
  <text x="100" y="255" font-family="monospace" font-size="8" fill="#c4a96b" text-anchor="middle">50–350°C</text>
  <!-- Air flow arrows -->
  <path d="M130,277 L170,275" stroke="#c4a96b" stroke-width="1.5" marker-end="url(#ad)" opacity="0.7"/>
  <path d="M320,260 L360,258" stroke="#c4a96b" stroke-width="1" marker-end="url(#ad)" opacity="0.4"/>
  <path d="M500,248 L540,246" stroke="#c4a96b" stroke-width="1" marker-end="url(#ad)" opacity="0.3"/>
  <!-- Product exit (right) -->
  <rect x="640" y="228" width="55" height="28" stroke="#1a3325" stroke-width="2" fill="#eee8d8" rx="3"/>
  <text x="667" y="246" font-family="monospace" font-size="7" fill="#5a6e58" text-anchor="middle">PRODUCT</text>
  <!-- Exhaust stack -->
  <rect x="645" y="185" width="22" height="43" stroke="#5a6e58" stroke-width="1.5" fill="none" rx="2"/>
  <text x="656" y="180" font-family="monospace" font-size="7" fill="#5a6e58" text-anchor="middle">EXHAUST</text>
  <!-- Drive -->
  <rect x="690" y="220" width="40" height="28" rx="3" stroke="#1a3325" stroke-width="2" fill="#eee8d8"/>
  <text x="710" y="238" font-family="monospace" font-size="7" fill="#5a6e58" text-anchor="middle">DRIVE</text>
  <!-- Dimension line -->
  <line x1="130" y1="370" x2="630" y2="370" stroke="#5a6e58" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="130" y1="365" x2="130" y2="375" stroke="#5a6e58" stroke-width="1"/>
  <line x1="630" y1="365" x2="630" y2="375" stroke="#5a6e58" stroke-width="1"/>
  <text x="380" y="388" font-family="monospace" font-size="10" fill="#5a6e58" text-anchor="middle">8m – 30m</text>
  <!-- Throughput callout -->
  <rect x="580" y="90" width="140" height="40" rx="4" stroke="#c4a96b" stroke-width="1.5" fill="none"/>
  <text x="650" y="108" font-family="monospace" font-size="8" fill="#c4a96b" text-anchor="middle">THROUGHPUT</text>
  <text x="650" y="124" font-family="Georgia, serif" font-size="15" fill="#1a3325" text-anchor="middle" font-weight="bold">0.5 – 50 TPH</text>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c4a96b"/>
    </marker>
  </defs>
</svg>