<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f7f2ea"/>
  <!-- Ground line -->
  <line x1="50" y1="400" x2="750" y2="400" stroke="#5a6e58" stroke-width="1.5"/>
  <!-- Left column -->
  <rect x="130" y="160" width="20" height="240" stroke="#1a3325" stroke-width="3" fill="none"/>
  <!-- Right column -->
  <rect x="650" y="160" width="20" height="240" stroke="#1a3325" stroke-width="3" fill="none"/>
  <!-- Foundation -->
  <rect x="115" y="395" width="50" height="20" stroke="#1a3325" stroke-width="2" fill="#eee8d8" rx="2"/>
  <rect x="635" y="395" width="50" height="20" stroke="#1a3325" stroke-width="2" fill="#eee8d8" rx="2"/>
  <!-- Roof truss - top chord -->
  <line x1="130" y1="160" x2="400" y2="80" stroke="#1a3325" stroke-width="3"/>
  <line x1="400" y1="80" x2="670" y2="160" stroke="#1a3325" stroke-width="3"/>
  <!-- Bottom chord -->
  <line x1="130" y1="160" x2="670" y2="160" stroke="#1a3325" stroke-width="3"/>
  <!-- Truss web members (Pratt pattern) -->
  <g stroke="#c4a96b" stroke-width="2">
    <!-- Verticals -->
    <line x1="220" y1="160" x2="220" y2="140"/>
    <line x1="310" y1="160" x2="310" y2="118"/>
    <line x1="400" y1="160" x2="400" y2="80"/>
    <line x1="490" y1="160" x2="490" y2="118"/>
    <line x1="580" y1="160" x2="580" y2="140"/>
    <!-- Diagonals -->
    <line x1="130" y1="160" x2="220" y2="140"/>
    <line x1="220" y1="160" x2="310" y2="118"/>
    <line x1="310" y1="160" x2="400" y2="80"/>
    <line x1="490" y1="118" x2="400" y2="160"/>
    <line x1="580" y1="140" x2="490" y2="160"/>
    <line x1="670" y1="160" x2="580" y2="140"/>
  </g>
  <!-- Purlins -->
  <g stroke="#5a6e58" stroke-width="1" stroke-dasharray="4,4">
    <line x1="175" y1="150" x2="175" y2="148"/>
    <line x1="265" y1="130" x2="535" y2="130"/>
    <line x1="355" y1="100" x2="445" y2="100"/>
  </g>
  <!-- Roof sheeting indication -->
  <path d="M130,160 L400,80 L670,160" stroke="#5a6e58" stroke-width="1" fill="#eee8d8" fill-opacity="0.3"/>
  <!-- Crane rail (optional) -->
  <line x1="155" y1="250" x2="665" y2="250" stroke="#c4a96b" stroke-width="2"/>
  <rect x="350" y="240" width="100" height="15" stroke="#c4a96b" stroke-width="1.5" fill="none" rx="2"/>
  <text x="400" y="230" font-family="monospace" font-size="8" fill="#c4a96b" text-anchor="middle">EOT CRANE RAIL</text>
  <!-- Span dimension -->
  <line x1="140" y1="440" x2="660" y2="440" stroke="#5a6e58" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="140" y1="435" x2="140" y2="445" stroke="#5a6e58" stroke-width="1"/>
  <line x1="660" y1="435" x2="660" y2="445" stroke="#5a6e58" stroke-width="1"/>
  <text x="400" y="458" font-family="monospace" font-size="10" fill="#5a6e58" text-anchor="middle">Clear Span up to 30m</text>
  <!-- Height dimension -->
  <line x1="90" y1="80" x2="90" y2="400" stroke="#5a6e58" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="85" y1="80" x2="95" y2="80" stroke="#5a6e58" stroke-width="1"/>
  <line x1="85" y1="400" x2="95" y2="400" stroke="#5a6e58" stroke-width="1"/>
  <!-- Ridge joint -->
  <circle cx="400" cy="80" r="5" stroke="#1a3325" stroke-width="2" fill="#c4a96b"/>
  <!-- Gusset plates at joints -->
  <circle cx="130" cy="160" r="4" stroke="#1a3325" stroke-width="1.5" fill="#c4a96b"/>
  <circle cx="670" cy="160" r="4" stroke="#1a3325" stroke-width="1.5" fill="#c4a96b"/>
  <!-- Labels -->
  <text x="400" y="30" font-family="Georgia, serif" font-size="22" fill="#1a3325" text-anchor="middle" font-weight="bold">Industrial Shed Truss</text>
  <text x="400" y="53" font-family="monospace" font-size="11" fill="#5a6e58" text-anchor="middle" letter-spacing="2">STRUCTURAL STEEL</text>
  <!-- Truss type label -->
  <text x="400" y="180" font-family="monospace" font-size="9" fill="#c4a96b" text-anchor="middle">PRATT TRUSS CONFIGURATION</text>
</svg>