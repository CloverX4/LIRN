<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f7f2ea"/>
  <!-- U-Trough body -->
  <path d="M150,180 L150,300 Q150,370 250,370 L550,370 Q650,370 650,300 L650,180" stroke="#1a3325" stroke-width="3" fill="none"/>
  <!-- Cover/lid -->
  <line x1="150" y1="180" x2="650" y2="180" stroke="#1a3325" stroke-width="2.5"/>
  <!-- Hinged cover indication -->
  <path d="M150,180 Q150,165 165,165 L400,165" stroke="#5a6e58" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="300" y="158" font-family="monospace" font-size="7" fill="#5a6e58" text-anchor="middle">HINGED COVER</text>
  <!-- Central shaft -->
  <line x1="100" y1="270" x2="700" y2="270" stroke="#1a3325" stroke-width="4"/>
  <!-- Outer ribbon -->
  <g stroke="#c4a96b" stroke-width="2.5" fill="none">
    <path d="M200,200 Q230,270 200,340"/>
    <path d="M270,340 Q300,270 270,200"/>
    <path d="M340,200 Q370,270 340,340"/>
    <path d="M410,340 Q440,270 410,200"/>
    <path d="M480,200 Q510,270 480,340"/>
    <path d="M550,340 Q580,270 550,200"/>
  </g>
  <!-- Inner ribbon (dashed, opposite direction) -->
  <g stroke="#c4a96b" stroke-width="1.5" fill="none" stroke-dasharray="6,4" opacity="0.6">
    <path d="M220,340 Q250,270 220,200"/>
    <path d="M290,200 Q320,270 290,340"/>
    <path d="M360,340 Q390,270 360,200"/>
    <path d="M430,200 Q460,270 430,340"/>
    <path d="M500,340 Q530,270 500,200"/>
    <path d="M570,200 Q600,270 570,340"/>
  </g>
  <!-- Flow direction arrows -->
  <path d="M250,220 L320,220" stroke="#c4a96b" stroke-width="1" marker-end="url(#arrowB)" opacity="0.5"/>
  <path d="M380,320 L310,320" stroke="#c4a96b" stroke-width="1" marker-end="url(#arrowB)" opacity="0.5"/>
  <text x="285" y="210" font-family="monospace" font-size="7" fill="#c4a96b" text-anchor="middle">OUTER</text>
  <text x="345" y="335" font-family="monospace" font-size="7" fill="#c4a96b" text-anchor="middle">INNER</text>
  <!-- Bearing housings -->
  <rect x="85" y="255" width="30" height="30" stroke="#1a3325" stroke-width="2" fill="#eee8d8" rx="3"/>
  <rect x="685" y="255" width="30" height="30" stroke="#1a3325" stroke-width="2" fill="#eee8d8" rx="3"/>
  <!-- Drive end -->
  <rect x="715" y="240" width="55" height="60" rx="4" stroke="#1a3325" stroke-width="2" fill="#eee8d8"/>
  <text x="742" y="274" font-family="monospace" font-size="8" fill="#5a6e58" text-anchor="middle">DRIVE</text>
  <!-- Discharge valve -->
  <rect x="380" y="370" width="40" height="25" stroke="#1a3325" stroke-width="2" fill="#eee8d8" rx="3"/>
  <text x="400" y="415" font-family="monospace" font-size="8" fill="#5a6e58" text-anchor="middle">DISCHARGE</text>
  <!-- Feed inlet -->
  <rect x="240" y="140" width="60" height="40" stroke="#5a6e58" stroke-width="2" fill="none" rx="3"/>
  <text x="270" y="135" font-family="monospace" font-size="8" fill="#5a6e58" text-anchor="middle">FEED</text>
  <!-- Support legs -->
  <line x1="220" y1="370" x2="220" y2="440" stroke="#1a3325" stroke-width="2.5"/>
  <line x1="400" y1="395" x2="400" y2="440" stroke="#1a3325" stroke-width="2.5"/>
  <line x1="580" y1="370" x2="580" y2="440" stroke="#1a3325" stroke-width="2.5"/>
  <line x1="180" y1="440" x2="620" y2="440" stroke="#1a3325" stroke-width="2"/>
  <!-- Labels -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="22" fill="#1a3325" text-anchor="middle" font-weight="bold">Industrial Blender</text>
  <text x="400" y="73" font-family="monospace" font-size="11" fill="#5a6e58" text-anchor="middle" letter-spacing="2">RIBBON BLENDER</text>
  <!-- Capacity callout -->
  <rect x="80" y="120" width="55" height="50" rx="4" stroke="#c4a96b" stroke-width="1.5" fill="none"/>
  <text x="107" y="140" font-family="monospace" font-size="7" fill="#c4a96b" text-anchor="middle">BATCH</text>
  <text x="107" y="160" font-family="Georgia, serif" font-size="11" fill="#1a3325" text-anchor="middle" font-weight="bold">20m³</text>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c4a96b"/>
    </marker>
  </defs>
</svg>